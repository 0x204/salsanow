name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SalsaNOW.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test SalsaNOW.Tests/SalsaNOW.Tests.csproj -c Release --no-build

      - name: Upload SalsaNOW.exe
        uses: actions/upload-artifact@v4
        with:
          name: SalsaNOW
          path: SalsaNOW/bin/Release/net48/SalsaNOW.exe
          if-no-files-found: error
